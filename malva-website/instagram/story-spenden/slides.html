<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:Outfit;font-weight:400;src:url(../../src/assets/fonts/outfit-latin-400-normal.woff2)}
@font-face{font-family:Outfit;font-weight:500;src:url(../../src/assets/fonts/outfit-latin-500-normal.woff2)}
@font-face{font-family:Outfit;font-weight:600;src:url(../../src/assets/fonts/outfit-latin-600-normal.woff2)}
:root{--g:#1F3D33;--c:#F4F2EE;--m:#4E5A55;--ll:#C3B1F2;--lt:#7B5CD6;--sl:#9CCBA8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:#888}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;padding:0 100px 150px;display:flex;flex-direction:column;justify-content:center}
.story{height:1920px}
.dark{background:var(--g);color:var(--c)} .light{background:var(--c);color:var(--g)}
.hl{color:var(--ll)} .light .hl{color:var(--lt)}
.kicker{font-weight:600;font-size:36px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:40px;color:var(--ll)}
.light .kicker{color:var(--lt)}
h1{font-weight:600;font-size:150px;line-height:1.02;letter-spacing:-.035em}
h2{font-weight:600;font-size:82px;line-height:1.12;letter-spacing:-.025em}
.body{font-size:44px;line-height:1.45;margin-top:56px;font-weight:500}
.dark .body{color:#E4E8E2} .light .body{color:var(--m)}
.sage{color:var(--sl);font-weight:600;font-size:52px;line-height:1.3;margin-top:56px}
.light .sage{color:#2F6B48}
.sig{color:var(--ll);font-size:40px;font-weight:500;margin-top:22px}
.foot{position:absolute;left:100px;right:96px;bottom:84px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:22px;font-weight:600;font-size:44px;letter-spacing:-.03em}
.brand svg{height:58px;width:auto}
.num{font-size:38px;font-weight:500;opacity:.75}
.more{font-size:40px;font-weight:500;color:var(--ll)}
.light .more{color:var(--lt)}
.list{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:64px}
.list li{font-size:50px;line-height:1.3;font-weight:500;display:grid;grid-template-columns:56px 1fr;gap:44px;align-items:start}
.list li svg{width:56px;height:56px;margin-top:2px}
.photo{width:240px;height:240px;border-radius:50%;object-fit:cover;border:6px solid var(--sl);margin-bottom:56px}
.mark-top{width:200px;margin-bottom:90px}
.center{text-align:center;align-items:center}
.sp{padding:0 100px;justify-content:flex-start;align-items:center;text-align:center}
.biglogo{display:flex;align-items:center;gap:26px;margin-top:300px}
.biglogo svg{height:150px;width:auto}
.biglogo span{font-weight:600;font-size:130px;letter-spacing:-.03em;line-height:1}
.ask{font-weight:600;font-size:78px;line-height:1.15;letter-spacing:-.02em;margin-top:150px}
.sub2{font-size:46px;line-height:1.4;margin-top:40px;color:#E4E8E2}
.heartbig{font-size:64px;color:var(--sl);font-weight:600;margin-top:44px}
.slot{position:absolute;left:150px;right:150px;bottom:360px;height:150px;border:3px dashed rgba(244,242,238,.25);border-radius:30px;display:flex;align-items:center;justify-content:center;color:rgba(244,242,238,.35);font-size:30px}
.arrow{position:absolute;left:0;right:0;bottom:540px;text-align:center}
.arrow svg{width:70px;height:70px}
</style></head><body>
<template id="mark-d"><svg viewBox="0 0 200 200"><path transform="translate(84 104) rotate(-26)" d="M0 -62 C34 -30 34 30 0 62 C-34 30 -34 -30 0 -62 Z" fill="#C3B1F2" fill-opacity=".92"/><path transform="translate(116 104) rotate(26)" d="M0 -62 C34 -30 34 30 0 62 C-34 30 -34 -30 0 -62 Z" fill="#9CCBA8" fill-opacity=".85"/></svg></template>
<template id="mark-h"><svg viewBox="0 0 200 200"><path transform="translate(84 104) rotate(-26)" d="M0 -62 C34 -30 34 30 0 62 C-34 30 -34 -30 0 -62 Z" fill="#A58BEA" fill-opacity=".9"/><path transform="translate(116 104) rotate(26)" d="M0 -62 C34 -30 34 30 0 62 C-34 30 -34 -30 0 -62 Z" fill="#7FAF8E" fill-opacity=".82"/></svg></template>


<section class="slide dark story sp" id="story">
  <div class="biglogo" data-mark="d"><span>malva</span></div>
  <p class="ask">Magst du uns mit einer <span class="hl">kleinen Spende</span> helfen?</p>
  <p class="sub2">Oder teile den Link.<br>Jeder Euro zählt.</p>
  <p class="heartbig">Teilen kann heilen. 💚</p>
  <div class="arrow"><svg viewBox="0 0 24 24"><path d="M12 4v15m0 0l-6-6m6 6l6-6" fill="none" stroke="#9CCBA8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</section>
<script>document.querySelectorAll("[data-mark]").forEach(el=>el.prepend(document.getElementById("mark-"+el.dataset.mark).content.cloneNode(true)));</script></body></html>
