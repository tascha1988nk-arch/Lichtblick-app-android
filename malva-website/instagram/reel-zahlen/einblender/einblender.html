<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
@font-face{font-family:Outfit;font-weight:500;src:url(../../../src/assets/fonts/outfit-latin-500-normal.woff2)}
@font-face{font-family:Outfit;font-weight:600;src:url(../../../src/assets/fonts/outfit-latin-600-normal.woff2)}
html,body{margin:0;background:transparent;font-family:Outfit,sans-serif}
.wrap{display:inline-block;padding:20px}
.card{max-width:900px;box-sizing:border-box;display:inline-flex;flex-direction:column;align-items:center;padding:34px 60px 40px;border-radius:44px;background:rgba(31,61,51,.88);color:#F4F2EE}
.plain{max-width:900px;box-sizing:border-box;display:inline-flex;flex-direction:column;align-items:center;padding:10px 30px;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.35)}
.n{font-weight:600;font-size:230px;line-height:.95;letter-spacing:-.04em;color:#C3B1F2}
.plain .n{color:#fff}
.k{font-weight:600;font-size:46px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px;color:#9CCBA8;text-align:center;line-height:1.2}
.plain .k{color:#fff}
.u{font-weight:500;font-size:84px;line-height:1.1;letter-spacing:-.02em;margin-top:6px}
</style></head><body>
<div id="list"></div>
<script>
const items=[["Durchschnittliche Wartezeit","142","Tage"],["Jedes Jahr psychisch erkrankt","17,8","Millionen Erwachsene"],["Frührenten wegen psychischer Erkrankung","41 %",""],["Zusätzlich nötige Kassensitze","7.000","für Psychotherapie"]];
const L=document.getElementById('list');
items.forEach(([t,n,u],i)=>{for(const k of ['card','plain']){const w=document.createElement('div');w.className='wrap';w.id=k+i;w.innerHTML=`<div class="${k}"><div class="k">${t}</div><div class="n">${n}</div>${u?`<div class="u">${u}</div>`:""}</div>`;L.appendChild(w);L.appendChild(document.createElement('br'));}});
</script></body></html>
