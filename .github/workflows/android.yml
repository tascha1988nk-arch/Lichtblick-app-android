# Baut die App auf GitHubs Servern (dort ist das Android SDK vorinstalliert),
# stellt eine installierbare Debug-APK bereit und führt alle Tests aus.
name: Android-Build

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Debug-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: lichtblick-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Tests (Logik + Oberfläche)
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Testberichte bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          retention-days: 14
