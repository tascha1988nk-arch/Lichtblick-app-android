# Baut die App auf GitHubs Servern (dort ist das Android SDK vorinstalliert),
# stellt eine installierbare Debug-APK bereit und führt alle Tests aus.
name: Android-Build

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Debug-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: lichtblick-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Tests (Logik + Oberfläche)
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Testberichte bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          retention-days: 14

      # Nur wenn der geheime Hochlade-Schlüssel bei GitHub hinterlegt ist:
      # signierte Play-Store-Version (.aab) bauen.
      - name: Play-Store-Version (AAB) bauen
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          LICHTBLICK_UPLOAD_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          LICHTBLICK_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          LICHTBLICK_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks" ./gradlew :app:bundleRelease --stacktrace
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Play-Store-Version bereitstellen
        if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lichtblick-playstore-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
